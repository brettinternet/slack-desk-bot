---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  setup: .taskfiles/setup.yaml

tasks:
  default:
    silent: true
    cmd: task -l

  init:
    desc: Install dependencies and set up the repository
    deps:
      - task: setup:init

  start:
    desc: Start SlackDeskBot
    cmd: bun run start

  doctor:
    desc: Validate local setup without starting the service
    cmd: bun src/doctor-cli.ts

  service:install:
    desc: Install and start the supported macOS LaunchAgent
    cmd: bun scripts/install-launch-agent.ts

  check:
    desc: Run type, formatting, and configuration checks
    cmds:
      - bun run check
      - mise exec prettier -- prettier --check --ignore-unknown .
      - task: check:config

  check:config:
    desc: Validate deployment and configuration documents
    cmd: bun test test/config-documents.test.ts

  check:staged:
    desc: Run checks only for staged files
    aliases: [check-staged]
    cmd: mise exec lefthook -- lefthook run pre-commit

  fix:
    desc: Format project files
    cmd: mise exec prettier -- prettier --write --ignore-unknown .

  test:
    desc: Run tests
    cmd: bun test
